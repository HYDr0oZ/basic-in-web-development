<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#6c4f8d',
                        'brand-dark': '#5a3f74',
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-[#fcfdfc] text-[#2a2a2a] font-sans">
<!--
    Author: Baptiste Rault
    Date: 2025-11-12
-->
    <!-- Header - Responsive padding and text size -->
    <header class="pt-6 pb-3 md:pt-8 md:pb-4 bg-brand text-white">
        <h1 class="text-xl sm:text-2xl md:text-3xl lg:text-4xl font-bold text-center m-0 px-4">Registration</h1>
    </header>

    <!-- Main Content - Responsive margins -->
    <main class="mx-[2%] sm:mx-[5%] md:mx-[8%] lg:mx-[15%] xl:mx-[20%] pt-4 pb-8">
        <!-- Top Grid: Student Info & Registration Form - Stacks on mobile, side-by-side on larger screens -->
        <div class="flex flex-col lg:flex-row gap-4 mb-4">
            
            <!-- Registration Form Card - Full width on mobile, half on desktop -->
            <div class="bg-white border border-[#e0e0e0] rounded-lg p-4 md:p-6 shadow-sm flex-1">
                <h2 class="text-lg md:text-xl font-semibold mb-3 md:mb-4">Registration Form</h2>
                
                <form id="registrationForm" class="space-y-3 md:space-y-4">
                    <!-- Hidden timestamp field -->
                    <input type="hidden" id="timestamp" name="timestamp">

                    <!-- Full Name -->
                    <div class="flex flex-col gap-1">
                        <label for="fullName" class="font-medium text-gray-700 text-sm md:text-base">Full Name</label>
                        <input 
                            type="text" 
                            id="fullName" 
                            name="fullName" 
                            class="px-3 py-2 border border-[#e0e0e0] rounded-md text-sm md:text-base focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand focus:ring-opacity-20 transition-all"
                            required
                        >
                        <span id="fullNameError" class="text-red-600 text-xs md:text-sm hidden mt-1"></span>
                    </div>

                    <!-- Email -->
                    <div class="flex flex-col gap-1">
                        <label for="email" class="font-medium text-gray-700 text-sm md:text-base">Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="px-3 py-2 border border-[#e0e0e0] rounded-md text-sm md:text-base focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand focus:ring-opacity-20 transition-all"
                            required
                        >
                        <span id="emailError" class="text-red-600 text-xs md:text-sm hidden mt-1"></span>
                    </div>

                    <!-- Phone -->
                    <div class="flex flex-col gap-1">
                        <label for="phone" class="font-medium text-gray-700 text-sm md:text-base">Phone Number</label>
                        <input 
                            type="tel" 
                            id="phone" 
                            name="phone" 
                            class="px-3 py-2 border border-[#e0e0e0] rounded-md text-sm md:text-base focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand focus:ring-opacity-20 transition-all"
                            required
                        >
                        <span id="phoneError" class="text-red-600 text-xs md:text-sm hidden mt-1"></span>
                    </div>

                    <!-- Birth Date -->
                    <div class="flex flex-col gap-1">
                        <label for="birthDate" class="font-medium text-gray-700 text-sm md:text-base">Birth Date</label>
                        <input 
                            type="date" 
                            id="birthDate" 
                            name="birthDate" 
                            class="px-3 py-2 border border-[#e0e0e0] rounded-md text-sm md:text-base focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand focus:ring-opacity-20 transition-all"
                            required
                        >
                        <span id="birthDateError" class="text-red-600 text-xs md:text-sm hidden mt-1"></span>
                    </div>

                    <!-- Terms Checkbox -->
                    <div class="flex flex-row items-center gap-2">
                        <input 
                            type="checkbox" 
                            id="terms" 
                            name="terms" 
                            class="w-4 h-4 md:w-[18px] md:h-[18px] cursor-pointer accent-brand"
                            required
                        >
                        <label for="terms" class="cursor-pointer m-0 text-xs sm:text-sm md:text-base">I accept the terms and conditions</label>
                    </div>
                    <span id="termsError" class="text-red-600 text-xs md:text-sm hidden mt-1"></span>

                    <!-- Submit Button - Full width on mobile, auto on larger screens -->
                    <button 
                        type="submit" 
                        class="w-full md:w-auto px-5 py-2.5 border border-[#e0e0e0] rounded-md bg-brand text-white cursor-pointer text-sm md:text-base font-medium hover:bg-brand-dark active:scale-95 transition-all shadow-sm hover:shadow-md"
                    >
                        Register
                    </button>
                </form>
            </div>
        </div>

        <!-- Table Container - Responsive overflow and padding -->
        <div class="bg-white border border-[#e0e0e0] rounded-lg p-3 md:p-4 lg:p-6 overflow-x-auto shadow-md">
            <h2 class="text-lg md:text-xl font-semibold mb-3 md:mb-4">Registered Participants</h2>
            
            <!-- Table wrapper for horizontal scroll on small screens -->
            <div class="overflow-x-auto -mx-3 md:mx-0">
                <table id="participantsTable" class="w-full min-w-[600px] border-collapse text-xs sm:text-sm">
                    <thead>
                        <tr>
                            <th class="bg-brand text-white text-left p-2 md:p-3 border-b border-[#e0e0e0] whitespace-nowrap">Timestamp</th>
                            <th class="bg-brand text-white text-left p-2 md:p-3 border-b border-[#e0e0e0] whitespace-nowrap">Full Name</th>
                            <th class="bg-brand text-white text-left p-2 md:p-3 border-b border-[#e0e0e0] whitespace-nowrap">Email</th>
                            <th class="bg-brand text-white text-left p-2 md:p-3 border-b border-[#e0e0e0] whitespace-nowrap">Phone</th>
                            <th class="bg-brand text-white text-left p-2 md:p-3 border-b border-[#e0e0e0] whitespace-nowrap">Birth Date</th>
                        </tr>
                    </thead>
                    <tbody class="[&>tr:nth-child(even)]:bg-[#f9f5ff]">
                        <!-- Rows will be added dynamically by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="index.js"></script>
</body>
</html>
